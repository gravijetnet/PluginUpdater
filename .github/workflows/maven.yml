name: Build and Release PluginUpdater

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Get Version Info
        id: version_info
        run: |
          echo "short_commit=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "commit_count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: >
          mvn -B package
          -Dcommit.count=${{ steps.version_info.outputs.commit_count }}
          -Dgithub.build_number=${{ github.run_number }}
          -Dgithub.short_commit=${{ steps.version_info.outputs.short_commit }}
          --file pom.xml

      - name: Collect JARs
        run: |
          # Paper fat-JAR (shaded, contains core)
          PAPER_JAR=$(find paper/target/ -name "*.jar" ! -name "original-*" | head -n 1)
          # Velocity fat-JAR (shaded, contains core + Gson + SnakeYAML relocated)
          VELOCITY_JAR=$(find velocity/target/ -name "*.jar" ! -name "original-*" | head -n 1)

          if [ -z "$PAPER_JAR" ] || [ -z "$VELOCITY_JAR" ]; then
            echo "Error: could not find built JARs"
            ls paper/target/ velocity/target/ || true
            exit 1
          fi

          cp "$PAPER_JAR"    "./PluginUpdater-Paper-build-${{ github.run_number }}.jar"
          cp "$VELOCITY_JAR" "./PluginUpdater-Velocity-build-${{ github.run_number }}.jar"
          cp "$PAPER_JAR"    "./PluginUpdater-Paper-latest.jar"
          cp "$VELOCITY_JAR" "./PluginUpdater-Velocity-latest.jar"

      - name: Create Archive Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "PluginUpdater Build #${{ github.run_number }}"
          body: "Permanent archive — Build #${{ github.run_number }}."
          files: |
            PluginUpdater-Paper-build-${{ github.run_number }}.jar
            PluginUpdater-Velocity-build-${{ github.run_number }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PluginUpdater — Latest Build"
          body: "Always contains the newest JARs from the main branch."
          make_latest: true
          files: |
            PluginUpdater-Paper-latest.jar
            PluginUpdater-Velocity-latest.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
